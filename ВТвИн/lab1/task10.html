    <h2>«Странные» буквы</h2>

    <hr>

    <p>
        <img src="task10.png" alt="Странные буквы">
    </p>

    <p>В современном русском языке не склоняются:</p>

    <ul>
        <li>иннициальные аббревиатуры (составленные из первых букв слов), кончающиеся гласным, например: 
            <abbr title="Белорусский государственный университет информатики и радиоэлектроники">БГУИР</abbr>,
            <abbr title="Открытое акционерное общество">ОАО</abbr>;</li>
        <li>заимствованные аббревиатуры, кончающиеся твердым согласным, например:
            <abbr title="Maschinenfabrik Augsburg-Nürnberg">MAN</abbr>.</li>
    </ul>
