<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab4Task5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- linear-gradient -->
    <h3>linear-gradient</h3>
    <div class="frame frame-1">
        <div class="row">
            <div class="box lg-1"></div>
            <div class="box lg-2"></div>
            <div class="box lg-3"></div>
        </div>
        <div class="row">
            <div class="box lg-4"></div>
            <div class="box lg-5"></div>
        </div>
    </div>

    <!-- radial-gradient -->
    <h3>radial-gradient</h3>
    <div class="frame frame-2">
        <div class="row">
            <div class="box rg-1"></div>
            <div class="box rg-2"></div>
        </div>
        <div class="row">
            <div class="box rg-3"></div>
            <div class="box rg-4"></div>
        </div>
    </div>

    <!-- repeating gradients -->
    <h3>repeating gradients</h3>
    <div class="frame frame-3">
        <div class="rep-1"></div>
        <div class="rep-2"></div>
        <div class="rep-3"></div>
    </div>

</body>
</html>
