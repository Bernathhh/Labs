<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab2Task8</title>
</head>
<body>

        <h3>Запись на курсы</h3>
        <hr>

        <form action="#" method="post">
            <p>
                Имя:<br>
                <input type="text" name="name" placeholder="Екатерина">
            </p>

            <p>
                Язык программирования:<br>
                <label><input type="radio" name="language" value="cpp"> C++</label><br>
                <label><input type="radio" name="language" value="php"> PHP</label><br>
                <label><input type="radio" name="language" value="java"> Java</label>
            </p>

            <p>
                Дополнительная информация:<br>
                <textarea name="info" rows="4" cols="30" placeholder="Начальный уровень"></textarea>
            </p>

            <p>
                Секретное слово:<br>
                <input type="password" name="secret_word" placeholder="Пароль">
            </p>

            <p>
                <input type="submit" value="Отправить">
                <input type="reset" value="Очистить">
            </p>
        </form>

        <hr>
        <p>www.bsuir.by</p>

</body>
</html>
