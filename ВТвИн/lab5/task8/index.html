<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab5Task8</title>
</head>
<body>
    <script>
        // Стрелочная функция с вложенным тернарным оператором
        const compare = (a, b) => a > b ? 1 : (a < b ? -1 : 0);

        // Проверка всех трех случаев:
        alert("Сравнение 10 и 5 (a > b): " + compare(10, 5));   // выведет 1
        alert("Сравнение 3 и 8 (a < b): " + compare(3, 8));     // выведет -1
        alert("Сравнение 7 и 7 (a === b): " + compare(7, 7));   // выведет 0
    </script>
</body>
</html>
