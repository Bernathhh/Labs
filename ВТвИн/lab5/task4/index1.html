<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab5Task4.1</title>
</head>
<body>
    <script>
        let time = 34; // число от 0 до 59

        if (time >= 0 && time <= 14) {
            alert("Число попадает в первую четверть часа.");
        } else if (time >= 15 && time <= 29) {
            alert("Число попадает во вторую четверть часа.");
        } else if (time >= 30 && time <= 44) {
            alert("Число попадает в третью четверть часа.");
        } else if (time >= 45 && time <= 59) {
            alert("Число попадает в четвертую четверть часа.");
        } else {
            alert("Некорректное число (должно быть от 0 до 59).");
        }
    </script>
</body>
</html>
