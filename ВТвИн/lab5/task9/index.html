<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab5Task9</title>
</head>
<body>
    <script>
        // Исходная строка для проверки
        let str = "http://bsuir.by/index.html";

        // 1. Проверка на наличие в начале строки 'http://'
        if (str.startsWith("http://")) {
            alert("1. Строка начинается с http://");
        } else {
            alert("1. Строка НЕ начинается с http://");
        }

        // 2. Проверка на наличие в конце строки '.html'
        if (str.endsWith(".html")) {
            alert("2. Строка заканчивается на .html");
        } else {
            alert("2. Строка НЕ заканчивается на .html");
        }
    </script>
</body>
</html>
